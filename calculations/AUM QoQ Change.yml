unique_name: AUM QoQ Change
object_type: metric_calc
label: AUM QoQ Change
description: 'Quarter-over-Quarter AUM Change, in USD: AUM at a quarter end minus AUM at the previous quarter end.
  Compares two month-end balances; it is not a sum of the quarter''s months.'
expression: '[Measures].[AUM] - [Measures].[AUM Prior Quarter End]'
