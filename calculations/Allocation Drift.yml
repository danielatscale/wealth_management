unique_name: Allocation Drift
object_type: metric_calc
label: Allocation Drift
description: 'Allocation drift (over/underweight vs target) in percentage points: actual Asset Allocation minus
  Target Allocation for an asset class at a month end; positive is overweight, negative underweight. Meaningful
  per account and asset class (or averaged); never add drift across accounts.'
expression: '[Measures].[Asset Allocation] - [Measures].[Target Allocation]'
format: '#,##0.00'
ai_context:
- source_type: catalog
  source: horizon-glossary:SE_DEMO_LIBRARY.METADATA.GLOSSARY_TERMS/Allocation Drift
