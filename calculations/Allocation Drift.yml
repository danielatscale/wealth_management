unique_name: Allocation Drift
object_type: metric_calc
label: Allocation Drift
description: 'Allocation drift (overweight / underweight vs target) in percentage points: actual asset allocation
  minus target allocation per account and asset class at a month end; positive is overweight, negative underweight.
  Query per account and asset class (e.g. most underweight fixed income); never add drift across accounts - use
  Average Allocation Drift for groups.'
expression: '[Measures].[Asset Allocation Pct] - [Measures].[Target Allocation Pct]'
ai_context:
- source_type: catalog
  source: Horizon glossary Allocation Drift
