unique_name: Unrealized Gain
object_type: metric
label: Unrealized Gain
description: 'Unrealized gain or loss (paper gain) on positions still held: market value minus cost basis, USD,
  at a month end; negative is an unrealized loss. A balance taking the last month end, not additive across months;
  not Realized Gain from sales.'
dataset: Positions
column: UNREALIZED_GAIN
calculation_method: sum
format: $#,##0
semi_additive:
  position: last
  relationships:
  - Positions to Month End
