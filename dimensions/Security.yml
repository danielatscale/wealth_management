unique_name: Security
object_type: dimension
label: Security
type: standard
level_attributes:
- unique_name: Security
  label: Security
  description: Security (holding, instrument) name, unique per security; classified by asset class, sector and region.
    Not the Ticker attribute, which is its symbol.
  dataset: Securities
  key_columns:
  - SECURITY_ID
  name_column: SECURITY_NAME
  sort_column: SECURITY_NAME
  is_unique_key: true
  ai_context:
  - source_type: catalog
    source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_SECURITY.SECURITY_NAME
hierarchies:
- unique_name: Security Hierarchy
  label: Security
  filter_empty: 'yes'
  folder: Security
  levels:
  - unique_name: Security
    secondary_attributes:
    - unique_name: Ticker
      label: Ticker
      description: Ticker symbol (synthetic), unique per security; the symbol, not the Security name.
      dataset: Securities
      name_column: TICKER
      key_columns:
      - TICKER
      ai_context:
      - source_type: catalog
        source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_SECURITY.TICKER
    - unique_name: Sector
      label: Sector
      description: GICS sector for equities (Communication Services, Consumer Discretionary, Consumer Staples, Energy,
        Financials, Health Care, Industrials, Technology, Utilities); '-' for non-equity securities, so sector exposure
        is only meaningful within the Equity asset class.
      dataset: Securities
      name_column: SECTOR
      key_columns:
      - SECTOR
      ai_context:
      - source_type: catalog
        source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_SECURITY.SECTOR
    - unique_name: Issuer Region
      label: Issuer Region
      description: 'Issuer region of the security: US or International; not Household Region or Advisor Office Region.'
      dataset: Securities
      name_column: REGION
      key_columns:
      - REGION
      ai_context:
      - source_type: catalog
        source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_SECURITY.REGION
    - unique_name: Expense Ratio
      label: Expense Ratio
      description: Annual fund expense ratio in percent (0.75 means 0.75% a year), 0 for single stocks; a security
        attribute, not a return.
      dataset: Securities
      name_column: EXPENSE_RATIO
      key_columns:
      - EXPENSE_RATIO
      ai_context:
      - source_type: catalog
        source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_SECURITY.EXPENSE_RATIO
relationships:
- unique_name: Security to Asset Class
  from:
    hierarchy: Security Hierarchy
    level: Security
    dataset: Securities
    join_columns:
    - ASSET_CLASS
  to:
    dimension: Asset Class
    level: Asset Class
  type: embedded
ai_context:
- source_type: catalog
  source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_SECURITY
