unique_name: Account
object_type: dimension
label: Account
type: standard
level_attributes:
- unique_name: Account
  label: Account
  description: Client account number (account ID); each account belongs to one household and is managed to one risk
    model. The finest level of the advisor > household > account rollup, below Household.
  dataset: Accounts
  key_columns:
  - ACCOUNT_ID
  name_column: ACCOUNT_ID
  is_unique_key: true
  ai_context:
  - source_type: catalog
    source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_ACCOUNT.ACCOUNT_ID
hierarchies:
- unique_name: Account Hierarchy
  label: Account
  filter_empty: 'yes'
  folder: Account
  levels:
  - unique_name: Account
    secondary_attributes:
    - unique_name: Account Type
      label: Account Type
      description: 'Account type (tax wrapper): Brokerage, Traditional IRA, Roth IRA, 401(k) Rollover, Trust; not
        Account Registration.'
      dataset: Accounts
      name_column: ACCOUNT_TYPE
      key_columns:
      - ACCOUNT_TYPE
      ai_context:
      - source_type: catalog
        source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_ACCOUNT.ACCOUNT_TYPE
    - unique_name: Account Registration
      label: Account Registration
      description: 'Account registration (ownership title): Individual, Joint (JTWROS), Custodial, Trust; not Account
        Type.'
      dataset: Accounts
      name_column: REGISTRATION
      key_columns:
      - REGISTRATION
      ai_context:
      - source_type: catalog
        source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_ACCOUNT.REGISTRATION
    - unique_name: Risk Model
      label: Risk Model
      description: 'Risk model, the investment profile the account is managed to: Conservative, Moderate, Growth
        or Aggressive, from least to most equity; sets the target allocation. Not Client Segment.'
      dataset: Accounts
      name_column: RISK_MODEL
      key_columns:
      - RISK_MODEL
      ai_context:
      - source_type: catalog
        source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_ACCOUNT.RISK_MODEL
    - unique_name: Account Open Date
      label: Account Open Date
      description: Date the account was opened; not the Household Acquisition Date.
      dataset: Accounts
      name_column: OPEN_DATE
      key_columns:
      - OPEN_DATE
      ai_context:
      - source_type: catalog
        source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_ACCOUNT.OPEN_DATE
relationships:
- unique_name: Account to Household
  from:
    hierarchy: Account Hierarchy
    level: Account
    dataset: Accounts
    join_columns:
    - HOUSEHOLD_ID
  to:
    dimension: Household
    level: Household
  type: embedded
ai_context:
- source_type: catalog
  source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_ACCOUNT
