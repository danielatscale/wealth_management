unique_name: Account
object_type: dimension
label: Account
type: standard
level_attributes:
- unique_name: Account
  label: Account
  description: Client account (3,315). Each account belongs to one household and follows one target risk model.
  dataset: ds_dim_account
  key_columns:
  - ACCOUNT_ID
  name_column: ACCOUNT_ID
  is_unique_key: true
hierarchies:
- unique_name: Account
  label: Account
  filter_empty: 'yes'
  folder: Account
  levels:
  - unique_name: Account
    secondary_attributes:
    - unique_name: Account Type
      label: Account Type
      description: 'Account type: Brokerage, Traditional IRA, Roth IRA, 401(k) Rollover, Trust.'
      dataset: ds_dim_account
      name_column: ACCOUNT_TYPE
      key_columns:
      - ACCOUNT_TYPE
    - unique_name: Account Registration
      label: Account Registration
      description: 'Account registration: Individual, Joint (JTWROS), Custodial, Trust.'
      dataset: ds_dim_account
      name_column: REGISTRATION
      key_columns:
      - REGISTRATION
    - unique_name: Risk Model
      label: Risk Model
      description: 'The investment profile an account is managed to: Conservative, Moderate, Growth or Aggressive,
        from least to most equity. Equity targets: Conservative 30, Moderate 55, Growth 70, Aggressive 85 percent.'
      dataset: ds_dim_account
      name_column: RISK_MODEL
      key_columns:
      - RISK_MODEL
    - unique_name: Account Open Date
      label: Account Open Date
      description: Date the account was opened.
      dataset: ds_dim_account
      name_column: OPEN_DATE
      key_columns:
      - OPEN_DATE
relationships:
- unique_name: Account_to_Household
  from:
    hierarchy: Account
    level: Account
    dataset: ds_dim_account
    join_columns:
    - HOUSEHOLD_ID
  to:
    dimension: Household
    level: Household
  type: embedded
