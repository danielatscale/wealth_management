unique_name: Month End
object_type: dimension
label: Month End
type: time
level_attributes:
- unique_name: Year
  label: Year
  description: Calendar year of the month-end calendar, 2023 to 2026; balances such as AUM at a year take the last
    month end in the year.
  dataset: Month End Calendar
  key_columns:
  - YEAR_NUM
  name_column: YEAR_NUM
  time_unit: year
  ai_context:
  - source_type: catalog
    source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_DATE.YEAR_NUM
- unique_name: Quarter
  label: Quarter
  description: Calendar quarter as year and quarter, e.g. 2026-Q2; balances such as AUM at a quarter take the quarter-end
    month (March, June, September, December).
  dataset: Month End Calendar
  key_columns:
  - YEAR_NUM
  - QUARTER_NUM
  name_column: QUARTER_NAME
  time_unit: quarter
  ai_context:
  - source_type: catalog
    source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_DATE.QUARTER_NAME
- unique_name: Month
  label: Month
  description: Calendar month as year and month, e.g. 2026-06; one snapshot per month. Same grain as Month End Date,
    which carries the actual date.
  dataset: Month End Calendar
  key_columns:
  - YEAR_NUM
  - QUARTER_NUM
  - MONTH_NUM
  name_column: YEAR_MONTH
  time_unit: month
  ai_context:
  - source_type: catalog
    source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_DATE.YEAR_MONTH
- unique_name: Month End Date
  label: Month End Date
  description: Month-end date (as-of date, snapshot date), e.g. 2026-06-30, 2023-07-31 to 2026-06-30; realized gains
    land on the month end of their sell date. Not the Sell Date attribute of realized lots.
  dataset: Month End Calendar
  key_columns:
  - DATE_ID
  name_column: DATE_ID
  time_unit: day
  is_unique_key: true
  ai_context:
  - source_type: catalog
    source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_DATE.DATE_ID
hierarchies:
- unique_name: Month End Hierarchy
  label: Month End
  filter_empty: 'yes'
  folder: Month End
  levels:
  - unique_name: Year
  - unique_name: Quarter
  - unique_name: Month
  - unique_name: Month End Date
    secondary_attributes:
    - unique_name: Month Name
      label: Month Name
      description: Calendar month name, January to December, without the year; use Month (e.g. 2026-06) to tell
        years apart.
      dataset: Month End Calendar
      name_column: MONTH_NAME
      key_columns:
      - MONTH_NAME
      ai_context:
      - source_type: catalog
        source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_DATE.MONTH_NAME
    - unique_name: Is Quarter End
      label: Is Quarter End
      description: Quarter-end flag, TRUE for March, June, September and December month ends.
      dataset: Month End Calendar
      name_column: IS_QUARTER_END
      key_columns:
      - IS_QUARTER_END
      ai_context:
      - source_type: catalog
        source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_DATE.IS_QUARTER_END
    - unique_name: Is Year End
      label: Is Year End
      description: Year-end flag, TRUE for the December month end; not Is Quarter End.
      dataset: Month End Calendar
      name_column: IS_YEAR_END
      key_columns:
      - IS_YEAR_END
      ai_context:
      - source_type: catalog
        source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_DATE.IS_YEAR_END
ai_context:
- source_type: catalog
  source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_DATE
- notes:
  - DIM_DATE is one row per month end; it is the only calendar. The generator-proposed daily calendar was not used.
    Month and Month End Date are 1:1.
