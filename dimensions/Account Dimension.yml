unique_name: Account Dimension
object_type: dimension
label: Account Dimension
description: 'The advisory book: Advisor > Household > Account, snowflaked across dim_advisor, dim_household, dim_account (Rule 5).'
type: standard
hierarchies:
- unique_name: Book Hierarchy
  label: Book Hierarchy
  description: Advisor rolls up households which roll up accounts.
  filter_empty: 'yes'
  folder: Book Attributes
  levels:
  - unique_name: Advisor
    secondary_attributes:
    - unique_name: Office Region
      label: Office Region
      dataset: dim_advisor
      name_column: OFFICE_REGION
      key_columns:
      - OFFICE_REGION
      description: Advisor office region.
    - unique_name: Advisor Seniority
      label: Advisor Seniority
      dataset: dim_advisor
      name_column: IS_SENIOR
      key_columns:
      - IS_SENIOR
      description: Whether the advisor is senior.
    - unique_name: Advisor Tenure Years
      label: Advisor Tenure Years
      dataset: dim_advisor
      name_column: TENURE_YEARS
      key_columns:
      - TENURE_YEARS
      description: Advisor tenure in years.
  - unique_name: Household
    secondary_attributes:
    - unique_name: Segment
      label: Segment
      dataset: dim_household
      name_column: SEGMENT
      key_columns:
      - SEGMENT
      description: 'Wealth segment: Mass Affluent / HNW / UHNW (NLQ5).'
    - unique_name: Household Region
      label: Household Region
      dataset: dim_household
      name_column: REGION
      key_columns:
      - REGION
      description: Household region.
  - unique_name: Account
    secondary_attributes:
    - unique_name: Account Type
      label: Account Type
      dataset: dim_account
      name_column: ACCOUNT_TYPE
      key_columns:
      - ACCOUNT_TYPE
      description: Brokerage / IRA / 401(k) Rollover / Trust.
    - unique_name: Registration
      label: Registration
      dataset: dim_account
      name_column: REGISTRATION
      key_columns:
      - REGISTRATION
      description: Account registration.
    - unique_name: Risk Model
      label: Risk Model
      dataset: dim_account
      name_column: RISK_MODEL
      key_columns:
      - RISK_MODEL
      description: 'Target risk model: Conservative/Moderate/Growth/Aggressive.'
level_attributes:
- unique_name: Advisor
  label: Advisor
  description: Financial advisor (top of the book).
  dataset: dim_advisor
  is_unique_key: true
  key_columns:
  - ADVISOR_ID
  name_column: ADVISOR_NAME
- unique_name: Household
  label: Household
  description: Client household.
  dataset: dim_household
  is_unique_key: true
  key_columns:
  - HOUSEHOLD_ID
  name_column: HOUSEHOLD_NAME
- unique_name: Account
  label: Account
  description: Individual account (leaf; fact join grain). Account number is the label.
  dataset: dim_account
  is_unique_key: true
  key_columns:
  - ACCOUNT_ID
  name_column: ACCOUNT_ID
relationships:
- from:
    dataset: dim_account
    join_columns:
    - HOUSEHOLD_ID
  to:
    level: Household
  type: snowflake
- from:
    dataset: dim_household
    join_columns:
    - ADVISOR_ID
  to:
    level: Advisor
  type: snowflake
