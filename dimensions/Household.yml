unique_name: Household
object_type: dimension
label: Household
type: standard
level_attributes:
- unique_name: Household
  label: Household
  description: 'Client household: a family or entity whose accounts are managed together under one advisor; Household
    AUM is the sum of its accounts market value at a month end. Household names are not unique (144 names across
    1,500 households), so list households with their ID, advisor or segment.'
  dataset: Households
  key_columns:
  - HOUSEHOLD_ID
  name_column: HOUSEHOLD_NAME
  is_unique_key: true
  ai_context:
  - source_type: catalog
    source: Horizon column comment SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_HOUSEHOLD.HOUSEHOLD_NAME; glossary Household
hierarchies:
- unique_name: Household Hierarchy
  label: Household
  filter_empty: 'yes'
  folder: Household
  levels:
  - unique_name: Household
    secondary_attributes:
    - unique_name: Household ID
      label: Household ID
      description: Household identifier (primary key); disambiguates households that share a display name.
      dataset: Households
      name_column: HOUSEHOLD_ID
      key_columns:
      - HOUSEHOLD_ID
      ai_context:
      - source_type: catalog
        source: Horizon column comment SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_HOUSEHOLD.HOUSEHOLD_ID
    - unique_name: Client Segment
      label: Client Segment
      description: 'Client wealth segment (wealth tier) of a household: Mass Affluent (about $1M average AUM), HNW
        - High Net Worth (about $12M) or UHNW - Ultra High Net Worth (about $104M).'
      dataset: Households
      name_column: SEGMENT
      key_columns:
      - SEGMENT
      ai_context:
      - source_type: catalog
        source: Horizon column comment SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_HOUSEHOLD.SEGMENT; glossary Client
          Segment
    - unique_name: Household Region
      label: Household Region
      description: 'Region where the household lives: Midwest, Northeast, Southeast, Southwest, West. Not the advisor''s
        office region.'
      dataset: Households
      name_column: REGION
      key_columns:
      - REGION
      ai_context:
      - source_type: catalog
        source: Horizon column comment SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_HOUSEHOLD.REGION
    - unique_name: Household Acquisition Date
      label: Household Acquisition Date
      description: Date the household became a client, 2008 to 2026.
      dataset: Households
      name_column: ACQUISITION_DATE
      key_columns:
      - ACQUISITION_DATE
      ai_context:
      - source_type: catalog
        source: Horizon column comment SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_HOUSEHOLD.ACQUISITION_DATE
relationships:
- unique_name: Household to Advisor
  from:
    hierarchy: Household Hierarchy
    level: Household
    dataset: Households
    join_columns:
    - ADVISOR_ID
  to:
    dimension: Advisor
    level: Advisor
  type: embedded
ai_context:
- source_type: catalog
  source: Horizon SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ
  notes:
  - Embedded to Advisor via FK_DIM_HOUSEHOLD_ADVISOR_ID; exactly one advisor per household.
