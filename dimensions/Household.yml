unique_name: Household
object_type: dimension
label: Household
type: standard
level_attributes:
- unique_name: Household
  label: Household
  description: Client household, a client family or entity whose accounts are managed together under one advisor;
    household AUM is the sum of its accounts. Household names are not unique, so list households with their advisor
    or segment; not the Account level beneath it.
  dataset: Households
  key_columns:
  - HOUSEHOLD_ID
  name_column: HOUSEHOLD_NAME
  sort_column: HOUSEHOLD_NAME
  is_unique_key: true
  ai_context:
  - source_type: catalog
    source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_HOUSEHOLD.HOUSEHOLD_NAME
  - source_type: catalog
    source: horizon-glossary:SE_DEMO_LIBRARY.METADATA.GLOSSARY_TERMS/Household
hierarchies:
- unique_name: Household Hierarchy
  label: Household
  filter_empty: 'yes'
  folder: Household
  levels:
  - unique_name: Household
    secondary_attributes:
    - unique_name: Client Segment
      label: Client Segment
      description: 'Client segment, the household wealth tier: Mass Affluent, HNW (High Net Worth) or UHNW (Ultra
        High Net Worth); a household attribute, not the account Risk Model.'
      dataset: Households
      name_column: SEGMENT
      key_columns:
      - SEGMENT
      ai_context:
      - source_type: catalog
        source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_HOUSEHOLD.SEGMENT
    - unique_name: Household Region
      label: Household Region
      description: 'Region where the household lives: Midwest, Northeast, Southeast, Southwest, West; not Advisor
        Office Region.'
      dataset: Households
      name_column: REGION
      key_columns:
      - REGION
      ai_context:
      - source_type: catalog
        source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_HOUSEHOLD.REGION
    - unique_name: Household Acquisition Date
      label: Household Acquisition Date
      description: Date the household became a client (client since, 2008 to 2026); not the Account Open Date.
      dataset: Households
      name_column: ACQUISITION_DATE
      key_columns:
      - ACQUISITION_DATE
      ai_context:
      - source_type: catalog
        source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_HOUSEHOLD.ACQUISITION_DATE
relationships:
- unique_name: Household to Advisor
  from:
    hierarchy: Household Hierarchy
    level: Household
    dataset: Households
    join_columns:
    - ADVISOR_ID
  to:
    dimension: Advisor
    level: Advisor
  type: embedded
ai_context:
- source_type: catalog
  source: horizon:SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ.DIM_HOUSEHOLD
