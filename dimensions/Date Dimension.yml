unique_name: Date Dimension
object_type: dimension
label: Date Dimension
description: Monthly month-end calendar. Role-played as 'As Of' (snapshots) and 'Sold' (realized gains).
type: time
hierarchies:
- unique_name: Date Hierarchy
  label: Date Hierarchy
  description: Calendar Year > Quarter > Month (month-end grain).
  filter_empty: 'yes'
  folder: Date Attributes
  levels:
  - unique_name: Year
    secondary_attributes:
    - unique_name: Year End Flag
      label: Year End Flag
      dataset: dim_date
      name_column: IS_YEAR_END
      key_columns:
      - IS_YEAR_END
      description: Whether the month is a calendar year-end.
  - unique_name: Quarter
    parallel_periods:
    - key_columns:
      - PRIOR_YEAR_NUM
      level: Year
    secondary_attributes:
    - unique_name: Quarter Number
      label: Quarter Number
      dataset: dim_date
      name_column: QUARTER_NUM
      key_columns:
      - QUARTER_NUM
      description: Quarter number within the year (1-4).
  - unique_name: Month
    parallel_periods:
    - key_columns:
      - PRIOR_YEAR_NUM
      level: Year
    secondary_attributes:
    - unique_name: Month Of Year Name
      label: Month Of Year Name
      dataset: dim_date
      name_column: MONTH_NAME
      key_columns:
      - MONTH_NAME
      description: Calendar month name (Jan..Dec), shared across years.
level_attributes:
- unique_name: Year
  label: Year
  description: Calendar year.
  dataset: dim_date
  key_columns:
  - YEAR_NUM
  name_column: YEAR_NUM
  sort_column: YEAR_NUM
  time_unit: year
- unique_name: Quarter
  label: Quarter
  description: Calendar quarter (unique per quarter, e.g. Q3 2023).
  dataset: dim_date
  key_columns:
  - QUARTER_NAME
  name_column: QUARTER_NAME
  sort_column: QUARTER_NAME
  time_unit: quarter
- unique_name: Month
  label: Month
  description: Calendar month-end (leaf). Join target for snapshot_date / sell_date.
  dataset: dim_date
  is_unique_key: true
  key_columns:
  - DATE_ID
  name_column: YEAR_MONTH
  sort_column: DATE_ID
  time_unit: month
