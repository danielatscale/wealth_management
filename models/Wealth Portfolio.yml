ai_context:
- source_type: catalog
  source: Snowflake Horizon - SE_DEMO_LIBRARY.WEALTH_PORTFOLIO_NLQ (comments, PK/FK, SE_DEMO_LIBRARY.METADATA glossary)
- notes:
  - One combined model with four facts (positions, account performance, realized gains, benchmark returns) plus
    a target-allocation fact derived from DIM_MODEL_TARGET x DIM_ACCOUNT.
  - 'Balances (AUM, cost basis, unrealized gain, quantity, position count, ending value, index level) are semi-additive
    last on Month End; beginning value is first. Per Horizon comments: never sum across months.'
  - 'Glossary formula terms published as metric_calcs: QoQ AUM Change (USD and %), Asset Allocation, Cash Share,
    Allocation Drift, Realized Gain YTD, Year-to-Date Return, Outperformance vs Benchmark.'
  - Sector Exposure is AUM grouped by Sector within Equity; no separate calc. Net New Assets is not measurable (NET_FLOW
    always 0) and is documented on Net Flow.
  - Numeric facts quoted in Horizon comments (row counts, $19.8B book, segment averages) were left out of descriptions
    to avoid unpinned numbers; AUM at 2026-06-30 = 19,808,138,318.19 verified by SQL.
  - 'MDX calcs not engine-validated: the model is not deployed in this run (sml-create-metric R8 runs at deploy).'
- role: check
  max_orphans:
    Positions.SNAPSHOT_DATE: 0
    Positions.ACCOUNT_ID: 0
    Positions.SECURITY_ID: 0
    Realized Gains.SELL_MONTH_END: 0
    Account Performance.ACCOUNT_ID: 0
    Account Target Allocations.ASSET_CLASS: 0
