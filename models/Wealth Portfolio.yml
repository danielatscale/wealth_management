unique_name: Wealth Portfolio
object_type: model
label: Wealth Portfolio
description: 'Wealth management advisory book: AUM, asset allocation vs risk-model targets, cash share, unrealized
  and realized gains, account and benchmark returns. Grain: month-end position snapshots (one row per account, security
  and month end), plus monthly account performance, realized sell lots and benchmark returns. Dimensions: Month
  End calendar, Advisor > Household > Account, Security, Asset Class, Holding Term, Benchmark.'
dimensions:
- Holding Term
- Sell Date
- Benchmark
